name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome to pRD and thanks for opening your first issue! 👋 Please make sure to check out our Wiki landing page for helpful guides, and we'll take a look at this soon."
          pr-message: "Thanks for submitting your very first pull request to pRD! 🎉 We appreciate your help and Katherine will be reviewing this shortly."
